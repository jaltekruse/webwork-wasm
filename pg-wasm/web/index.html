<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>PG in the Browser</title>
	<meta name="description" content="Render and grade WeBWorK PG problems in the browser, with Perl compiled to WebAssembly.">
	<link rel="manifest" href="manifest.webmanifest">
	<link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
	<link rel="stylesheet" href="app.css">
</head>
<body>
	<header class="app-header">
		<div class="container-fluid d-flex flex-wrap align-items-center gap-2">
			<h1 class="h5 m-0 me-auto">PG in the Browser <small class="text-body-secondary fw-normal">WeBWorK problems, no server</small></h1>
			<span id="status" class="badge text-bg-secondary" role="status" aria-live="polite">Loading...</span>
		</div>
	</header>

	<main class="container-fluid app-main">
		<section class="editor-pane" aria-label="Problem source">
			<div class="d-flex flex-wrap gap-2 align-items-end mb-2">
				<div class="flex-grow-1">
					<label for="problem-select" class="form-label small mb-0">Problem</label>
					<select id="problem-select" class="form-select form-select-sm"></select>
				</div>
				<div>
					<label for="file-input" class="btn btn-sm btn-outline-secondary mb-0" title="Open a .pg file from your computer">Open file...</label>
					<input type="file" id="file-input" accept=".pg,.txt" class="visually-hidden">
				</div>
			</div>
			<textarea id="source" class="form-control font-monospace" spellcheck="false" aria-label="PG source code"></textarea>
			<div class="d-flex flex-wrap gap-2 align-items-center mt-2">
				<div class="input-group input-group-sm seed-group">
					<label class="input-group-text" for="seed">Seed</label>
					<input type="number" id="seed" class="form-control" value="1234" min="1">
					<button id="new-seed" class="btn btn-outline-secondary" type="button" title="Random seed">New version</button>
				</div>
				<div class="form-check form-check-inline m-0">
					<input class="form-check-input" type="checkbox" id="show-hints" checked>
					<label class="form-check-label small" for="show-hints">Hints</label>
				</div>
				<div class="form-check form-check-inline m-0">
					<input class="form-check-input" type="checkbox" id="show-solutions">
					<label class="form-check-label small" for="show-solutions">Solutions</label>
				</div>
				<button id="render" class="btn btn-sm btn-primary ms-auto" type="button" disabled>Render</button>
			</div>
		</section>

		<section class="problem-pane" aria-label="Rendered problem">
			<iframe id="problem-frame" title="Rendered problem"></iframe>
			<div id="results" class="small"></div>
			<p id="timing" class="small text-body-secondary mt-2"></p>
		</section>
	</main>

	<script src="pg-client.js"></script>
	<script src="app.js"></script>
</body>
</html>
